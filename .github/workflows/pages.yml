# Build both demos and deploy to GitHub Pages under /astro/ and /react/.
# Repo Settings → Pages → Source: GitHub Actions

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build Astro demo
        env:
          OKUMA_DEMO_BASE: /Okuma-Reader/astro/
        run: npm run build -w @okuma-reader/demo-astro

      - name: Build React demo
        env:
          OKUMA_DEMO_BASE: /Okuma-Reader/react/
        run: npm run build -w @okuma-reader/demo-react

      - name: Assemble site
        run: |
          mkdir -p site/astro site/react
          cp -a apps/demo-astro/dist/. site/astro/
          cp -a apps/demo-react/dist/. site/react/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Okuma-Reader demos</title>
              <style>
                body {
                  margin: 0;
                  min-height: 100dvh;
                  font-family: system-ui, sans-serif;
                  display: grid;
                  place-items: center;
                  background: #f6f4f1;
                  color: #1a1a1a;
                }
                main { width: min(28rem, 100%); padding: 2rem; }
                h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
                p { margin: 0 0 1.25rem; color: #555; }
                ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
                a {
                  display: block;
                  padding: 1rem 1.15rem;
                  color: inherit;
                  text-decoration: none;
                  background: white;
                  border: 2px solid #1a1a1a;
                }
                a:hover, a:focus-visible { background: #1a1a1a; color: white; }
                strong { display: block; }
                span { display: block; margin-top: 0.25rem; font-size: 0.9rem; opacity: 0.75; }
              </style>
            </head>
            <body>
              <main>
                <h1>Okuma-Reader demos</h1>
                <p>Live demos from this repository.</p>
                <ul>
                  <li>
                    <a href="./astro/">
                      <strong>Astro demo</strong>
                      <span>/Okuma-Reader/astro/</span>
                    </a>
                  </li>
                  <li>
                    <a href="./react/">
                      <strong>React demo</strong>
                      <span>/Okuma-Reader/react/</span>
                    </a>
                  </li>
                </ul>
              </main>
            </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

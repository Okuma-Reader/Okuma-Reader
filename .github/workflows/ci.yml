name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check

      - name: Build demos (Pages base paths)
        run: |
          OKUMA_DEMO_BASE=/Okuma-Reader/astro/ npm run build -w @okuma-reader/demo-astro
          OKUMA_DEMO_BASE=/Okuma-Reader/react/ npm run build -w @okuma-reader/demo-react
